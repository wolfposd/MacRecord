name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild build \
            -project MacRecord.xcodeproj \
            -scheme MacRecord \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="$(git rev-parse --short HEAD)" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

      - name: Create DMG
        run: |
          mkdir dmg-root
          ditto build/Build/Products/Release/MacRecord.app dmg-root/MacRecord.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname MacRecord -srcfolder dmg-root -ov -format UDZO MacRecord.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacRecord
          path: MacRecord.dmg
          if-no-files-found: error
